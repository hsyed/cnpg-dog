  - apiVersion: v1
    kind: Service
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      name: dog-s0-read
      namespace: dog
    spec:
      ports:
        - name: postgres
          port: 5432
          targetPort: 5432
      selector:
        cnpg.io/cluster: dog-s0
        cnpg.io/instanceRole: replica
      trafficDistribution: PreferSameZone
      type: ClusterIP
  - apiVersion: v1
    kind: Service
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      name: dog-s1-read
