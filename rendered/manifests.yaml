      selector:
        cnpg.io/cluster: dog-s3
        cnpg.io/instanceRole: replica
      trafficDistribution: PreferSameZone
      type: ClusterIP
  - apiVersion: v1
    data:
      pgdog.toml: |
        [[databases]]
        database_name = 'dog'
        host = 'dog-s0-rw'
        name = 'dog'
        port = 5432
        role = 'primary'
        shard = 0

        [[databases]]
        database_name = 'dog'
        host = 'dog-s0-read'
        name = 'dog'
        port = 5432
        role = 'replica'
        shard = 0

        [[databases]]
        database_name = 'dog'
        host = 'dog-s1-rw'
        name = 'dog'
        port = 5432
        role = 'primary'
        shard = 1

        [[databases]]
        database_name = 'dog'
        host = 'dog-s1-read'
        name = 'dog'
        port = 5432
        role = 'replica'
        shard = 1

        [[databases]]
        database_name = 'dog'
        host = 'dog-s2-rw'
        name = 'dog'
        port = 5432
        role = 'primary'
        shard = 2

        [[databases]]
        database_name = 'dog'
        host = 'dog-s2-read'
        name = 'dog'
        port = 5432
        role = 'replica'
        shard = 2

        [[databases]]
        database_name = 'dog'
        host = 'dog-s3-rw'
        name = 'dog'
        port = 5432
        role = 'primary'
        shard = 3

        [[databases]]
        database_name = 'dog'
        host = 'dog-s3-read'
        name = 'dog'
        port = 5432
        role = 'replica'
        shard = 3

        [general]
        default_pool_size = 10
        host = '0.0.0.0'
        port = 6432
        workers = 2

        [[sharded_schemas]]
        database = 'dog'
        name = 'customer_a'
        shard = 0

        [[sharded_schemas]]
        database = 'dog'
        name = 'customer_b'
        shard = 1

        [[sharded_tables]]
        column = 'tenant_id'
        data_type = 'bigint'
        database = 'dog'

        [[sharded_tables]]
        column = 'company_id'
        data_type = 'uuid'
        database = 'dog'
        name = 'users'

        [[sharded_tables]]
        column = 'region'
        data_type = 'varchar'
        database = 'dog'

        [[sharded_tables.mapping]]
        shard = 0
        values = ['us', 'ca']

        [[sharded_tables.mapping]]
        shard = 1
        values = ['eu']

        [[sharded_tables.mapping]]
        shard = 2

        [[sharded_tables]]
        column = 'order_id'
        data_type = 'bigint'
        database = 'dog'

        [[sharded_tables.mapping]]
        end = 100
        shard = 0
        start = 1

        [[sharded_tables.mapping]]
        end = 200
        shard = 1
        start = 100

        [[sharded_tables.mapping]]
        shard = 2
    kind: ConfigMap
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      name: pgdog
      namespace: dog
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      name: pgdog
      namespace: dog
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: pgdog
      template:
        metadata:
          labels:
            app: pgdog
        spec:
          containers:
            - args:
                - --config
                - /etc/pgdog/pgdog.toml
                - --users
                - /etc/pgdog/users.toml
                - run
              command:
                - /usr/local/bin/pgdog
              image: ghcr.io/pgdogdev/pgdog:v0.1.53
              name: pgdog
              ports:
                - containerPort: 6432
                  name: pgdog
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 25m
                  memory: 32Mi
              volumeMounts:
                - mountPath: /etc/pgdog/pgdog.toml
                  name: config
                  subPath: pgdog.toml
                - mountPath: /etc/pgdog/users.toml
                  name: users
                  subPath: users.toml
          topologySpreadConstraints:
            - labelSelector:
                matchLabels:
                  app: pgdog
              maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
          volumes:
            - configMap:
                name: pgdog
              name: config
            - name: users
              secret:
                secretName: pgdog-users
  - apiVersion: v1
    kind: Service
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      name: pgdog
      namespace: dog
    spec:
      ports:
        - name: pgdog
          port: 6432
          targetPort: 6432
      selector:
        app: pgdog
      type: ClusterIP
