apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dog
      annotations:
        argocd.argoproj.io/sync-wave: "0"
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: dog-s0
      namespace: dog
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      instances: 3
      imageName: ghcr.io/cloudnative-pg/postgresql:18
      storage:
        size: 1Gi
      bootstrap:
        initdb:
          database: dog
          owner: dog
          secret:
            name: dog-app
      postgresql:
        synchronous:
          method: first
          number: 1
        syncReplicaElectionConstraint:
          enabled: true
          nodeLabelsAntiAffinity:
            - topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              cnpg.io/cluster: dog-s0
  - apiVersion: postgresql.cnpg.io/v1
