  - apiVersion: v1
    kind: Service
    metadata:
      name: dog-s0-read
      namespace: dog
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      type: ClusterIP
      trafficDistribution: PreferSameZone
      selector:
        cnpg.io/cluster: dog-s0
        cnpg.io/instanceRole: replica
      ports:
        - name: postgres
          port: 5432
