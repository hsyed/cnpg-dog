      postgresql:
        parameters:
          shared_buffers: 32MB
          max_connections: "64"
          work_mem: 1MB
          maintenance_work_mem: 16MB
          autovacuum_work_mem: 8MB
          min_wal_size: 32MB
          max_wal_size: 64MB
          jit: "off"
        synchronous:
          dataDurability: required
          method: any
          number: 1
      resources:
        limits:
          cpu: 250m
