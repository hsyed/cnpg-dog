apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      name: dog
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      labels:
        app.kubernetes.io/part-of: cnpg-dog
      name: dog-s0
      namespace: dog
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      affinity:
        podAntiAffinityType: required
        topologyKey: topology.kubernetes.io/zone
      bootstrap:
        initdb:
          database: dog
          owner: dog
          secret:
            name: dog-app
      imageName: ghcr.io/cloudnative-pg/postgresql:18
      instances: 3
      postgresql:
        parameters:
          shared_buffers: 32MB
          max_connections: "64"
          work_mem: 1MB
          maintenance_work_mem: 16MB
          autovacuum_work_mem: 8MB
          min_wal_size: 32MB
          max_wal_size: 64MB
          jit: "off"
        synchronous:
          dataDurability: required
          method: any
          number: 1
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
      storage:
        size: 512Mi
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      labels:
        app.kubernetes.io/part-of: cnpg-dog
      name: dog-s1
